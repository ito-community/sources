[package]
name = "atsumaru"
version = "0.2.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = "s"

[dependencies]
ito-rs = { git = "https://github.com/itoapp/ito-rs", rev = "d714347b9f183c5bd38abe85948d05d0b469256f" }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
