[package]
name = "atsumaru"
version = "0.4.2"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = "s"

[dependencies]
ito-rs = { git = "https://github.com/AtiinLabs/ito-rs", rev = "224e448c2fc6ce662d2e05ae8384eb01d05a1b77" }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
