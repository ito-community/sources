[package]
name = "atsumaru"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = "s"

[dependencies]
ito-rs = { git = "https://github.com/itoapp/ito-rs", rev = "03d7107fc0aa1622feed1cde10b93abd18eec3ba" }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
