[package]
name = "atsumaru"
version = "0.2.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = "s"

[dependencies]
ito-rs = { git = "https://github.com/itoapp/ito-rs", rev = "197dde8d6d09b33f3a4d8af7427df5137ef3ad1b" }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
