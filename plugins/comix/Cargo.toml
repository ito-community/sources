[package]
name = "comix"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ito-rs = { git = "https://github.com/AtiinLabs/ito-rs", rev = "213ccaa26b7d7c3bc68f5399ba12ef8414f187a9" }
base64 = "0.22.1"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = { version = "0.10.9", features = ["compress"] }
urlencoding = "2.1.3"
