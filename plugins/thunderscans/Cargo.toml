[package]
name = "thunderscans"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = "s"

[dependencies]
ito-rs = { git = "https://github.com/AtiinLabs/ito-rs", rev = "213ccaa26b7d7c3bc68f5399ba12ef8414f187a9" }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
scraper = { version = "0.24", default-features = false }
url = "2"
